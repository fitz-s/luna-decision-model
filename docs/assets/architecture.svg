<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" role="img" aria-labelledby="t d">
<title id="t">How it works</title>
<desc id="d">Your Jev or TypeSafe app calls a local Luna Decision Model service, which calls OpenAI GPT-6 Luna with your Codex login.</desc>
<style>
:root{color-scheme:light dark;--ink:#1f2328;--mute:#59636e;--line:#d1d9e0;--luna:#2a78d6;--jev:#eb6834;--cloud:#0f6cbd;--api:#6e7781}
@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--mute:#9198a1;--line:#3d444d;--luna:#3987e5;--jev:#d95926;--cloud:#58a6ff;--api:#8b949e}}
text{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.m{fill:var(--mute)}.s{font-size:13px}.b{font-weight:600}.h{font-size:19px;font-weight:700}.c{text-anchor:middle}
.api{fill:var(--api)}.pill{fill:none;stroke:var(--luna);stroke-width:2}.luna{fill:var(--luna)}.jev{fill:var(--jev)}.ln{stroke:var(--line);stroke-width:1;fill:none}
.box{fill:none;stroke:var(--line);stroke-width:1.5}.cloud{fill:none;stroke:var(--cloud);stroke-width:2}
.ar{stroke:var(--mute);stroke-width:1.8;fill:none}.arh{fill:var(--mute)}
</style>
<rect x="8" y="40" width="472" height="166" rx="14" class="box" stroke-dasharray="6 5"/>
<text x="22" y="60" class="m s b" letter-spacing="1">YOUR MACHINE</text>
<rect x="24" y="72" width="170" height="116" rx="10" class="box"/>
<text x="109" y="102" class="b c" style="font-size:16px">Your Jev /</text>
<text x="109" y="122" class="b c" style="font-size:16px">TypeSafe app</text>
<text x="109" y="152" class="m s c">your existing code</text>
<rect x="304" y="72" width="170" height="116" rx="10" class="box"/>
<text x="389" y="102" class="b c" style="font-size:16px">Luna Decision</text>
<text x="389" y="122" class="b c" style="font-size:16px">Model</text>
<text x="389" y="152" class="m s c">local service on your</text>
<text x="389" y="170" class="m s c">machine, no model</text>
<rect x="584" y="72" width="170" height="116" rx="10" class="cloud"/>
<text x="669" y="102" class="b c" style="font-size:16px">OpenAI</text>
<text x="669" y="122" class="b c" style="font-size:16px">GPT-6 Luna</text>
<text x="669" y="152" class="m s c">cloud, your ChatGPT /</text>
<text x="669" y="170" class="m s c">Codex subscription</text>
<path d="M198 118H299" class="ar"/>
<polygon points="293,114 300,118 293,122" class="arh"/>
<path d="M300 150H199" class="ar"/>
<polygon points="205,146 198,150 205,154" class="arh"/>
<text x="249" y="108" class="m s c">typed questions</text>
<text x="249" y="176" class="m s c">typed answers</text>
<path d="M490 118H575" class="ar"/>
<polygon points="569,114 576,118 569,122" class="arh"/>
<path d="M576 150H491" class="ar"/>
<polygon points="497,146 490,150 497,154" class="arh"/>
<text x="533" y="108" class="m s c">your text</text>
<text x="533" y="176" class="m s c">model answer</text>
</svg>
