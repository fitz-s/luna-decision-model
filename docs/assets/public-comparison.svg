<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 638" role="img" aria-labelledby="t d">
<title id="t">LLM decision model: Jev-level accuracy, no per-request bill, ~1 s per call</title>
<desc id="d">Jev, GPT-6 Luna through the Decisions API and through Luna Decision Model: accuracy, median latency and Brier score, plus cost.</desc>
